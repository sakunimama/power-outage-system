<!DOCTYPE html>
<html>
<head>
<title>Control Room Login</title>
</head>

<body>

<h2>Control Room Login</h2>

<input type="text" id="user" placeholder="Username"><br><br>
<input type="password" id="pass" placeholder="Password"><br><br>

<button onclick="login()">Login</button>

  <script>

function login(){

var u=document.getElementById("user").value.trim();
var p=document.getElementById("pass").value.trim();

if(u==="admin" && p==="admin123"){
window.location.href="dashboard.html";
}else{
alert("Wrong Username or Password");
}

}

</script>

</body>
</html>
