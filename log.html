<!DOCTYPE html>
<html>
<head>
<title>Outage Log</title>

<style>

body{
font-family:Arial;
background:#f4f6f9;
text-align:center;
}

h2{
margin-top:30px;
}

table{
margin:auto;
border-collapse:collapse;
margin-top:30px;
width:80%;
}

td,th{
border:1px solid black;
padding:10px;
font-size:15px;
}

th{
background:#2c3e50;
color:white;
}

button{
margin-top:20px;
padding:8px 15px;
border:none;
background:#e74c3c;
color:white;
cursor:pointer;
border-radius:4px;
}

</style>

</head>

<body>

<h2>⚡ Power Outage Log</h2>

<table id="logTable">

<tr>
<th>Time</th>
<th>Feeder</th>
<th>Status</th>
</tr>

</table>

<button onclick="clearLogs()">Clear Log</button>

<script>

var logs=JSON.parse(localStorage.getItem("outageLogs"))||[];

var table=document.getElementById("logTable");

logs.forEach(function(log){

var row=table.insertRow();

row.insertCell(0).innerText=log.time;
row.insertCell(1).innerText=log.feeder;
row.insertCell(2).innerText=log.status;

});

function clearLogs(){

if(confirm("Clear all outage logs?")){

localStorage.removeItem("outageLogs");

location.reload();

}

}

</script>

</body>
</html>
