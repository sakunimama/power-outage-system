<!DOCTYPE html>
<html>
<head>
<title>Feeder Status Board</title>

<style>

body{
font-family:Arial;
text-align:center;
background:#f4f6f9;
}

h2{
margin-top:30px;
}

table{
margin:auto;
border-collapse:collapse;
margin-top:30px;
}

td,th{
border:1px solid black;
padding:12px;
font-size:16px;
}

button{
margin:3px;
padding:6px 10px;
cursor:pointer;
border:none;
border-radius:4px;
}

.active{
background-color:#4CAF50;
color:white;
}

.fault{
background-color:red;
color:white;
}

.repair{
background-color:orange;
color:white;
}

.partial{
background-color:purple;
color:white;
}

.shutdown{
background-color:#3498db;
color:white;
}

</style>

</head>

<body>

<h2>⚡ Live Feeder Status Board</h2>

<table>

<tr>
<th>Feeder</th>
<th>Status</th>
<th>Action</th>
</tr>

<tr>
<td>Feeder 1</td>
<td class="active">Active</td>
<td>

<button onclick="setFault(this)">Fault</button>
<button onclick="setRepair(this)">Repair</button>
<button onclick="setPartial(this)">Partially Restored</button>
<button onclick="setShutdown(this)">Shutdown</button>
<button onclick="setActive(this)">Restore</button>

</td>
</tr>

<tr>
<td>Feeder 2</td>
<td class="active">Active</td>
<td>

<button onclick="setFault(this)">Fault</button>
<button onclick="setRepair(this)">Repair</button>
<button onclick="setPartial(this)">Partially Restored</button>
<button onclick="setShutdown(this)">Shutdown</button>
<button onclick="setActive(this)">Restore</button>

</td>
</tr>

<tr>
<td>Feeder 3</td>
<td class="active">Active</td>
<td>

<button onclick="setFault(this)">Fault</button>
<button onclick="setRepair(this)">Repair</button>
<button onclick="setPartial(this)">Partially Restored</button>
<button onclick="setShutdown(this)">Shutdown</button>
<button onclick="setActive(this)">Restore</button>

</td>
</tr>

</table>

<script>

function setFault(btn){
var cell=btn.parentElement.previousElementSibling;
cell.innerText="Fault";
cell.className="fault";
}

function setRepair(btn){
var cell=btn.parentElement.previousElementSibling;
cell.innerText="Under Repair";
cell.className="repair";
}

function setPartial(btn){
var cell=btn.parentElement.previousElementSibling;
cell.innerText="Partially Restored";
cell.className="partial";
}

function setShutdown(btn){
var cell=btn.parentElement.previousElementSibling;
cell.innerText="Shutdown";
cell.className="shutdown";
}

function setActive(btn){
var cell=btn.parentElement.previousElementSibling;
cell.innerText="Active";
cell.className="active";
}

</script>

</body>
</html>
